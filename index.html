<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="description" content="Sistema interno de declarações - E.M. Profª Eunice Carneiro">
  <title>Dashboard | Sistema de Declarações</title>
  <link rel="stylesheet" href="css/style.css">
</head>
<body data-page="dashboard">
  <div id="app"></div>

  <!-- Carregamento do script principal -->
  <script src="js/app.js?v=20260901"></script>
  
  <script>
    document.addEventListener("DOMContentLoaded", () => {
      // Aguarda a confirmação do carregamento do objeto DashboardPage
      if (typeof DashboardPage !== "undefined") {
        DashboardPage.init();
      } else {
        console.error("DashboardPage não encontrado em js/app.js. Recarregando...");
        setTimeout(() => location.reload(), 1000);
      }
    });
  </script>
</body>
</html>
